name: Publish

# Runs when you push a version tag, e.g.:
#   git tag v3.0.1 && git push origin v3.0.1
# Builds the mod, attaches the jar to a GitHub release, and publishes to Modrinth.
#
# Modrinth setup (one-time):
#   1. Create the project on https://modrinth.com and note its project ID
#      (Settings -> copy ID, an 8-character string).
#   2. Create a personal access token at https://modrinth.com/settings/pats
#      with the "Create versions" scope.
#   3. Add it to this repo: Settings -> Secrets and variables -> Actions ->
#      new repository secret named MODRINTH_TOKEN.
#   4. Replace REPLACE_WITH_MODRINTH_ID below with your project ID.
# Until the token secret exists, the Modrinth step is skipped and only the
# GitHub release is created.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the changelog is the commit subjects since the
          # previous tag, so shallow clones would leave it empty.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      # Every release gets a changelog without anyone writing one: the
      # commit subjects since the previous tag, minus the version bump.
      - name: Collect changelog
        id: changelog
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "text<<CHANGELOG_EOF"
            if [ -n "$prev" ]; then
              git log --pretty='- %s' "$prev..${GITHUB_REF_NAME}" | grep -v '^- Version ' || true
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog: ${{ steps.changelog.outputs.text }}
          files: build/libs/!(*-sources).jar
          loaders: fabric
          game-versions: ">=26.1"

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          modrinth-id: tLbSs6cD
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          changelog: ${{ steps.changelog.outputs.text }}
          files: build/libs/!(*-sources).jar
          loaders: fabric
          game-versions: ">=26.1"
